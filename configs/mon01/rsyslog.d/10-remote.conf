# /etc/rsyslog.d/10-remote.conf   (E1, mon01 = central log receiver)
# Listens on TCP 20514 and writes one file per sending host and program:
#   /var/log/remote/web01/sshd.log, /var/log/remote/web01/ak-backup.log, ...
# Create the directory first:
#   sudo install -d -o syslog -g adm -m 0750 /var/log/remote
# Check syntax before restarting:
#   sudo rsyslogd -N1 && sudo systemctl restart rsyslog

module(load="imtcp")
input(type="imtcp" port="20514")

template(name="PerHost" type="string"
         string="/var/log/remote/%HOSTNAME%/%PROGRAMNAME%.log")

# Remote messages go to the per-host files and stop there,
# so they don't also land in mon01's own /var/log/syslog.
if $fromhost-ip != "127.0.0.1" then {
    action(type="omfile" dynaFile="PerHost"
           dirCreateMode="0750" fileCreateMode="0640"
           dirGroup="adm" fileGroup="adm")
    stop
}
