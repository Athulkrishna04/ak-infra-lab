# /etc/nginx/conf.d/app.conf   (web01)
# nginx.conf includes conf.d/*.conf before its own sample server block,
# so this server is the first one on port 80 and answers any Host name.
#
#   /       -> static page from /srv/www   (SELinux type httpd_sys_content_t)
#   /app/   -> ak-app (python http.server) on 127.0.0.1:8080
#              nginx (httpd_t) connecting to a port is blocked by SELinux
#              until the right boolean is set - see INC-001.

server {
    listen 80;
    server_name web01.lab.local web01 192.168.56.11;
    root /srv/www;

    location /app/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
