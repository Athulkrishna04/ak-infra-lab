# /etc/ssh/sshd_config.d/10-hardening.conf   (web01 AND mon01)
#
# The file name starts with 10- so it is read before the distro's 50-*.conf.
# For most sshd options the FIRST value read wins, so these override the defaults.
# Apply only after key login works for your admin user (build guide M1.6),
# check with `sudo sshd -t`, and keep a second SSH session open while you reload.

PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
GSSAPIAuthentication no

# ops = admins, devs = developers (web01), akbackup = backup receiver (mon01 only).
# A group that doesn't exist on a node is simply never matched, so one line fits both nodes.
AllowGroups ops devs akbackup

MaxAuthTries 3
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2
X11Forwarding no
