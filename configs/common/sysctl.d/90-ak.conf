# /etc/sysctl.d/90-ak.conf   (E1, both nodes)
# Apply with: sudo sysctl --system
# Each key is a file under /proc/sys (dots become slashes), e.g.
#   kernel.dmesg_restrict  ->  /proc/sys/kernel/dmesg_restrict

# Only root may read the kernel ring buffer and kernel pointers
kernel.dmesg_restrict = 1
kernel.kptr_restrict = 2

# Ignore and never send ICMP redirects; drop spoofed source addresses
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.rp_filter = 1

# Survive a SYN flood
net.ipv4.tcp_syncookies = 1

# Small-RAM VMs: prefer dropping page cache over swapping out processes
vm.swappiness = 10
