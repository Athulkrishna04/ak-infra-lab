# /etc/rsyslog.d/90-forward.conf   (E1, web01 = log client)
# Forward everything to the central receiver on mon01 over TCP.
# The disk-assisted queue holds messages while mon01 is down and
# sends them when it comes back (resumeRetryCount -1 = retry forever).
#
# Rocky/SELinux: rsyslogd may only connect to ports labelled syslogd_port_t.
#   sudo semanage port -l | grep syslogd_port_t
# If 20514/tcp is not listed:
#   sudo semanage port -a -t syslogd_port_t -p tcp 20514

*.* action(type="omfwd" target="192.168.56.10" port="20514" protocol="tcp"
           queue.type="LinkedList" queue.filename="fwdq" queue.saveOnShutdown="on"
           action.resumeRetryCount="-1")
