# E3: run from ~/ak-infra-lab/ansible on mon01 (the control node).
#   ansible all -m ping
#   ansible-playbook site.yml --check --diff     # dry run first, always
#   ansible-playbook site.yml                    # asks for akadmin's sudo password once (-K is implied)
[defaults]
inventory = inventory.ini
roles_path = roles
retry_files_enabled = False
interpreter_python = auto_silent

[privilege_escalation]
become = True
become_ask_pass = True
