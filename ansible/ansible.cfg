# E3: run from ~/ak-infra-lab/ansible on mon01 (the control node), through the wrapper:
#   ./run.sh all -m ping                     # ad-hoc
#   ./run.sh site.yml --check --diff         # dry run first, always
#   ./run.sh site.yml                        # apply; run it twice: the second PLAY RECAP must show changed=0
# run.sh loads the per-host sudo passwords from an ansible-vault file OUTSIDE the repo
# (~/.ak-become.vault.yml), because akadmin's password differs between web01 and mon01.
# If the directory is world-writable, Ansible ignores this file: chmod -R go-w ~/ak-infra-lab
[defaults]
inventory = inventory.ini
roles_path = roles
retry_files_enabled = False
interpreter_python = auto_silent
stdout_callback = yaml

[privilege_escalation]
become = True
become_ask_pass = False
