---
# roles/common - baseline shared by every node (M0-M3).
# Every task is idempotent: a second run changes nothing. Files are copied from the repo,
# never pasted into YAML, so the repo stays the single source of truth.

- name: Time zone is Asia/Kolkata
  community.general.timezone:
    name: Asia/Kolkata

- name: Base tools are installed (Rocky Minimal lacks several; M1.2)
  ansible.builtin.package:
    name: "{{ common_pkgs[ansible_facts['os_family']] }}"
    state: present
  vars:
    common_pkgs:
      RedHat: [chrony, sysstat, rsync, tar, lsof, dnf-plugins-core, acl]
      Debian: [chrony, rsync]

- name: chrony steps the clock whenever it's off (VMs pause while the laptop sleeps; M3 fix)
  ansible.builtin.lineinfile:
    path: "{{ '/etc/chrony.conf' if ansible_facts['os_family'] == 'RedHat' else '/etc/chrony/chrony.conf' }}"
    regexp: '^makestep\s'
    line: "{{ 'makestep 1.0 -1' if ansible_facts['os_family'] == 'RedHat' else 'makestep 1 -1' }}"
  notify: Restart chrony

- name: chrony is running and enabled
  ansible.builtin.service:
    name: "{{ 'chronyd' if ansible_facts['os_family'] == 'RedHat' else 'chrony' }}"
    state: started
    enabled: true

- name: Admin and developer groups exist
  ansible.builtin.group:
    name: "{{ item }}"
    state: present
  loop:
    - ops
    - devs

- name: akadmin is in ops
  ansible.builtin.user:
    name: akadmin
    groups: ops
    append: true

- name: akadmin accepts the Windows admin key (public key, committed in configs/keys)
  ansible.posix.authorized_key:
    user: akadmin
    key: "{{ lookup('ansible.builtin.file', repo_root ~ '/configs/keys/akadmin-windows.pub') }}"

- name: akadmin on web nodes accepts mon01's key (how mon01 and Ansible reach web01)
  ansible.posix.authorized_key:
    user: akadmin
    key: "{{ lookup('ansible.builtin.file', repo_root ~ '/configs/keys/akadmin-mon01.pub') }}"
  when: inventory_hostname in groups['rocky']

- name: akdev exists on web nodes
  ansible.builtin.user:
    name: akdev
    groups: devs
    append: true
    shell: /bin/bash
  when: inventory_hostname in groups['rocky']

- name: akdev accepts its own key on web nodes
  ansible.posix.authorized_key:
    user: akdev
    key: "{{ lookup('ansible.builtin.file', repo_root ~ '/configs/keys/akdev-windows.pub') }}"
  when: inventory_hostname in groups['rocky']

# Match by IP, so a line written by hand with different spacing is corrected, not duplicated
# (the first dry run showed a plain `line:` would have added a second entry per host).
- name: Lab names resolve on every node
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^{{ item.ip | regex_escape }}\s'
    line: "{{ item.ip }} {{ item.name }}.lab.local {{ item.name }}"
  loop:
    - { ip: 192.168.56.10, name: mon01 }
    - { ip: 192.168.56.11, name: web01 }

- name: sudoers drop-in (checked by visudo before it replaces anything)
  ansible.builtin.copy:
    src: "{{ repo_root }}/configs/web01/sudoers.d/ak"
    dest: /etc/sudoers.d/ak
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s

- name: Health check and its helper
  ansible.builtin.copy:
    src: "{{ repo_root }}/scripts/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - healthcheck.sh
    - procstat.py

- name: Health check units
  ansible.builtin.copy:
    src: "{{ repo_root }}/systemd/{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - ak-health.service
    - ak-health.timer
  notify: Reload systemd

- name: Health timer is enabled and running
  ansible.builtin.systemd_service:
    name: ak-health.timer
    state: started
    enabled: true
    daemon_reload: true

# M1: kdump can't work on a 1.5 GB VM (no crashkernel reservation) and its failed unit
# would make the health check report WARN forever.
- name: kdump is disabled on web nodes
  ansible.builtin.systemd_service:
    name: kdump
    state: stopped
    enabled: false
  when: inventory_hostname in groups['rocky']
  failed_when: false        # a minimal install without kexec-tools has no kdump unit; that's fine too

- name: Read the kernel command line
  ansible.builtin.slurp:
    src: /proc/cmdline
  register: common_cmdline
  when: inventory_hostname in groups['rocky']

- name: No crashkernel reservation on web nodes (takes effect at the next boot)
  ansible.builtin.command: grubby --update-kernel=ALL --remove-args=crashkernel
  when:
    - inventory_hostname in groups['rocky']
    - "'crashkernel' in (common_cmdline.content | b64decode)"
