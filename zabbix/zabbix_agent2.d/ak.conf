# /etc/zabbix/zabbix_agent2.d/ak.conf   (web01)
# Custom checks, run by the agent as user 'zabbix'.
# Test locally:   zabbix_agent2 -t ak.health.status
# Test remotely:  zabbix_get -s 192.168.56.11 -k ak.backup.age      (from mon01)
# After editing:  sudo systemctl restart zabbix-agent2
#
# On mon01 keep only the first two lines: mon01 has no backup job, so ak.backup.age
# would always report 999999 there.

UserParameter=ak.mem.avail_pct,/usr/local/bin/procstat.py mem_avail_pct
UserParameter=ak.health.status,/usr/local/bin/healthcheck.sh >/dev/null; echo $?
UserParameter=ak.backup.age,/usr/local/bin/ak-backup-age.sh
